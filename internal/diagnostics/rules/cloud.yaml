# Cloud credential and backend access rules. Fixtures for these are written from
# the providers' documented messages (see testdata/README.md), not captured.
- id: aws-sso-expired
  supersedes: [aws-no-credentials]
  scope: terraform
  category: credentials
  severity: error
  match:
    any:
      - log: 'The SSO session associated with this profile has expired'
      - log: 'Error when retrieving token from sso: Token has expired'
      - log: 'refresh cached SSO token failed'
  extract:
    profile: '(?:--profile[ =]|profile ")([A-Za-z0-9_.-]+)'
  title: AWS SSO session expired
  explain: >
    The AWS SSO login{{ if .profile }} for profile {{ .profile }}{{ end }} has expired. Log in again, then re-run.
  steps:
    - title: Log in again in a terminal
      action: { kind: copy, label: Copy command, text: 'aws sso login{{ if .profile }} --profile {{ .profile }}{{ end }}' }
    - title: Re-plan
      action: { kind: run, label: 'Plan {{ .Target }}', run: { kind: tf.plan } }
  resolve: success

- id: aws-no-credentials
  scope: terraform
  category: credentials
  severity: error
  match:
    any:
      - log: 'No valid credential sources found'
      - log: 'failed to refresh cached credentials, no EC2 IMDS role found'
  title: No AWS credentials
  explain: >
    The AWS provider found no credentials: no AWS_PROFILE / AWS_ACCESS_KEY_ID in groundwork's environment, no default profile, no SSO session.
    Start groundwork from a shell that has credentials (e.g. after `aws sso login`), or set a profile in the provider block.
  steps:
    - title: Check what's set
      action: { kind: open, label: Run doctor, href: '/troubleshoot?doctor=1' }
  resolve: success

- id: tf-backend-access-denied
  scope: terraform
  category: backend
  severity: error
  match:
    any:
      - log: '(?s)(error loading state|Failed to get existing workspaces|Error refreshing state|failed to upload state).{0,400}(AccessDenied|403 Forbidden|StatusCode: 403)'
      - log: 'KMS.{0,200}AccessDeniedException'
  extract:
    bucket: 'S3 bucket "?([a-z0-9.-]+)"?'
    status: '(AccessDenied\w*|403 Forbidden)'
  title: 'Access denied to the state backend'
  explain: >
    The credentials in use can read or write the state ({{ if .bucket }}bucket {{ .bucket }}{{ else }}backend{{ end }}) only partly or not at all: {{ .status }}.
    Check you're using the right profile or role for {{ .Env }}, and that it can use the bucket's KMS key.
  steps:
    - title: Check which identity is in use
      action: { kind: copy, label: Copy command, text: 'aws sts get-caller-identity' }
  resolve: success
