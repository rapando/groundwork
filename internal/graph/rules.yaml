# Which resources are drawn as containers in the architecture view, and which
# arguments mean "this resource lives inside that one". Extend freely.
containers:
  - aws_vpc
  - google_compute_network
  - azurerm_virtual_network
  - hcloud_network
  - digitalocean_vpc
  - docker_network
via:
  # AWS
  vpc_id: [aws_vpc]
  subnet_id: [aws_subnet]
  subnet_ids: [aws_subnet]
  subnets: [aws_subnet]
  db_subnet_group_name: [aws_db_subnet_group]
  # GCP
  network: [google_compute_network]
  subnetwork: [google_compute_subnetwork]
  # Azure
  virtual_network_name: [azurerm_virtual_network]
  subnet_id_azure: [azurerm_subnet]
  # Hetzner
  network_id: [hcloud_network]
  # DigitalOcean
  vpc_uuid: [digitalocean_vpc]
# Resources that are machines Ansible can configure. A host matched to some
# other resource by address (an EIP, a network interface) is moved to the
# server that depends on it.
servers:
  - aws_instance
  - google_compute_instance
  - azurerm_linux_virtual_machine
  - azurerm_windows_virtual_machine
  - azurerm_virtual_machine
  - hcloud_server
  - digitalocean_droplet
  - linode_instance
  - vultr_instance
  - openstack_compute_instance_v2
  - oci_core_instance
  - proxmox_vm_qemu
  - vsphere_virtual_machine
  - libvirt_domain
  - lxd_instance
  - incus_instance
  - docker_container
