# Release: automatic from Conventional Commits on main (see docs/releasing.md);
# .github/workflows/release.yml tags vX.Y.Z and runs `goreleaser release`.
# Local dry run: goreleaser release --snapshot --clean  (artifacts in dist/)
version: 2
project_name: groundwork

before:
  hooks:
    - go mod verify
    # the SPA is committed in internal/server/dist; CI checks it matches web/

builds:
  - id: groundwork
    main: ./cmd/groundwork
    binary: groundwork
    env: [CGO_ENABLED=0]
    goos: [darwin, linux] # Windows isn't supported
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rapando/groundwork/internal/cli.Version={{ .Version }}
      - -X github.com/rapando/groundwork/internal/cli.Commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "groundwork_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing with cosign (Sigstore): the certificate in the bundle names
# this repository's release workflow, so install.sh can verify who built it.
# checksums.txt covers every archive, so signing it signs them all. cosign 3
# writes one bundle (signature, certificate, transparency-log entry).
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - id: archives
    artifacts: archive
    documents: ["${artifact}.sbom.spdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ['^(docs|test|chore|ci|build|style)(\(.*\))?:', "^Merge "]
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\(.+\))?:.+$'
      order: 3
    - title: Other changes
      order: 999

release:
  prerelease: auto # vX.Y.Z-rc.N tags are marked pre-release, not "latest"
  github:
    owner: rapando
    name: groundwork
  footer: |
    Install: `curl -fsSL https://raw.githubusercontent.com/rapando/groundwork/main/install.sh | sh`,
    or `go install github.com/rapando/groundwork/cmd/groundwork@{{ .Tag }}`.
    Verify downloads against checksums.txt; checksums.txt is signed with cosign
    (checksums.txt.sigstore.json) and each archive has an SPDX SBOM.
    See docs/install.md for the verify command.
