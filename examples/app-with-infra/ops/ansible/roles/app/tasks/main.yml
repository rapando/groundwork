---
- name: Install the app binary
  ansible.builtin.copy:
    src: "{{ app_binary }}"
    dest: /usr/local/bin/app
    mode: "0755"
  notify: Restart app

- name: Install the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    mode: "0644"
  notify: Restart app

- name: Enable and start the app
  ansible.builtin.systemd:
    name: app
    state: started
    enabled: true
    daemon_reload: true
