# Refreshing the package index changes nothing installed, so it runs in a
# dry run too: without it, the dry run can't tell what it would install.
- name: Update the package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  check_mode: false
  changed_when: false

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  register: nginx_install

# In a dry run on a new server the package isn't there yet, so there is
# nothing to configure or start: the dry run stops at "would install".
- name: Configure and start Nginx
  when: not (ansible_check_mode and nginx_install is changed)
  block:
    - name: Write the home page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
