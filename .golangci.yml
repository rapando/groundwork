version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback # deferred after Commit; the error is always ErrTxDone
  exclusions:
    # v1's defaults: unchecked Close/Flush/Remove/fmt.Fprint* are idiomatic
    presets: [std-error-handling, common-false-positives]
    rules:
      # test setup that fails shows up as a failing assertion
      - path: _test\.go
        linters: [errcheck]
