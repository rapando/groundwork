version: 2
# Minor and patch updates come grouped, one PR per ecosystem. Major updates
# come one PR each: they can break the build (a TypeScript major outside
# typescript-eslint's range, a pinia or vue-router API change) and must be
# reviewed and tested on their own. Merge only once ci is green.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
