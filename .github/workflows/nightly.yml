name: nightly
# Fuzzing and perf budgets run here rather than in ci: fuzzing is random, so a
# new finding shouldn't block an unrelated push or a release. Saved crashers in
# testdata/fuzz still run on every `go test` in ci.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 2m
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make fuzz FUZZTIME=${{ inputs.fuzztime || '2m' }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers # commit these under internal/<pkg>/testdata/fuzz/
          path: internal/*/testdata/fuzz/
  perf:
    # absolute budgets plus a 20% regression check against the previous passing
    # run's timings, carried in the cache (restore-keys falls back to the latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/cache@v4
        with:
          path: perf-baseline.json
          key: perf-baseline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: perf-baseline-${{ runner.os }}-
      - run: make perf
        env:
          GW_PERF_BASELINE: ${{ github.workspace }}/perf-baseline.json
          GW_PERF_WRITE_BASELINE: ${{ github.workspace }}/perf-baseline.json
