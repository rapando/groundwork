name: ci
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web
      - name: embedded dist is up to date
        run: git diff --exit-code -- internal/server/dist
      - run: cd web && npm test
      - run: pipx install ansible-core   # e2e drives real ansible against local-connection hosts
      - run: make e2e
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: terraform-linters/setup-tflint@v4
      - run: pipx install yamllint && pipx install ansible-lint
      - run: go test -tags integration ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v7
  demo:
    # a clean install from release archives, end to end on the demo repo (< 5 min)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: goreleaser/goreleaser-action@v6
        with: { distribution: goreleaser, version: "~> v2", args: release --snapshot --clean --skip=publish }
        env: { HOMEBREW_TAP_TOKEN: unused }
      - run: scripts/demo.sh
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fuzz FUZZTIME=20s
      - run: make perf
