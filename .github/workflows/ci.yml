name: ci
on:
  push:
    branches: [main] # PR branches are covered by pull_request
  pull_request:
permissions:
  contents: read
concurrency:
  # a newer push supersedes an older run of the same branch/PR (but every main commit runs: release needs it)
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    strategy:
      fail-fast: false # see each OS's failures, not "cancelled"
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web
      - name: embedded dist is up to date
        run: git diff --exit-code -- internal/server/dist
      - run: cd web && npm test
  e2e:
    # split across runners: on one runner, parallel tests starve each other's ansible/terraform runs
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pipx install ansible-core   # e2e drives real ansible against local-connection hosts
      - run: make e2e E2E_ARGS=--shard=${{ matrix.shard }}/3
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - uses: terraform-linters/setup-tflint@v6
      - run: pipx install yamllint && pipx install ansible-lint
      - run: go test -tags integration ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.14 } # bump deliberately: new releases add checks
  demo:
    # a clean install from release archives, end to end on the demo repo (< 5 min)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - uses: goreleaser/goreleaser-action@v7
        with: { distribution: goreleaser, version: "~> v2", args: release --snapshot --clean --skip=publish }
      - run: scripts/demo.sh
