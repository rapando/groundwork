name: release
# Releases are cut automatically from Conventional Commits:
#   - every push to main runs this as part of ci (see the `release-*` jobs in
#     ci.yml): the version is worked out by scripts/next-version.sh while the
#     tests run (feat: -> minor, fix:/perf:/revert: -> patch, `!` or
#     BREAKING CHANGE -> major), and once every ci job has passed the commit is
#     tagged vX.Y.Z and goreleaser publishes it
#   - "Run workflow" on main forces a release, at least the chosen bump
#   - pushing a vX.Y.Z tag by hand still releases that tag
on:
  workflow_call:
    inputs:
      stage:
        description: "version: only work out the tag; publish: tag and publish the given tag"
        type: string
        required: true
      tag:
        type: string
        default: ""
    outputs:
      tag:
        value: ${{ jobs.version.outputs.tag }}
  workflow_dispatch:
    inputs:
      bump:
        description: Minimum bump (auto = from commit messages only)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
  id-token: write # keyless cosign signing of checksums.txt

jobs:
  version:
    # from ci: runs alongside the tests; by hand or for a pushed tag: first step
    if: inputs.stage != 'publish' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif git tag --contains "$sha" --list 'v[0-9]*' | grep -q .; then
            echo "::notice::$sha is already part of $(git tag --contains "$sha" --list 'v[0-9]*' | head -1); nothing to release"
            tag=""
          else
            [ "${BUMP:-auto}" = auto ] && BUMP=""
            tag=$(scripts/next-version.sh $BUMP)
            if [ -z "$tag" ]; then
              echo "::notice::No feat/fix/perf/breaking commits since $(git describe --tags --abbrev=0 2>/dev/null || echo the start); nothing to release"
            elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"; exit 1
            else
              echo "::notice::Will release $tag once ci passes"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    # needs: version is skipped when ci calls with stage=publish; always() lets this run then
    if: >-
      always() &&
      ((inputs.stage == 'publish' && inputs.tag != '') ||
       (inputs.stage != 'publish' && inputs.stage != 'version' && needs.version.result == 'success' && needs.version.outputs.tag != ''))
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go test ./...
        if: inputs.stage != 'publish' # from ci, every test has already passed on this commit
      - name: Tag
        if: github.ref_type != 'tag'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "groundwork $TAG"
          # pushed with GITHUB_TOKEN, so this tag doesn't trigger another release
          git push origin "refs/tags/$TAG"
      - uses: sigstore/cosign-installer@v4.1.2 # no floating major tag is published
      - uses: anchore/sbom-action/download-syft@v0.24.3 # likewise
      - name: Hand-written release notes
        # docs/release-notes/<version>.md, when it exists, replaces the generated changelog
        id: notes
        run: |
          f="docs/release-notes/${TAG#v}.md"
          if [ -f "$f" ]; then echo "args=--release-notes=$f" >> "$GITHUB_OUTPUT"; echo "::notice::Using $f as the release notes"; fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
