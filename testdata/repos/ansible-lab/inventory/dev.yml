---
all:
  vars:
    app_port: 8000
  children:
    web:
      vars:
        nginx_workers: 1
      hosts:
        web-1:
          ansible_connection: local
        web-2:
          ansible_connection: local
          tier: canary
    db:
      hosts:
        db-1:
          ansible_connection: local
    flaky:
      hosts:
        down-1:
          ansible_host: 127.0.0.1
          ansible_port: 1
          ansible_user: nobody
          ansible_ssh_common_args: -o ConnectTimeout=2 -o StrictHostKeyChecking=no
